org.quartz.scheduler.instanceName = lunatech-chef-scheduler
org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
# Only three lightweight, independent cron jobs run (recurrent schedules,
# monthly reports, Slack lunch reminders). Quartz's default of 10 threads is
# needless contention on the single-vCPU Clever Cloud instance this runs on.
org.quartz.threadPool.threadCount = 3
org.quartz.jobStore.class = org.quartz.simpl.RAMJobStore
